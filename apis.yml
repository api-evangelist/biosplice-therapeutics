aid: biosplice-therapeutics
name: Biosplice Therapeutics
description: >-
  Biosplice Therapeutics, Inc. is a privately held, clinical-stage biopharmaceutical company
  headquartered in San Diego, California, founded in 2008 by Osman Kibar and known until its
  2020 rename as Samumed, LLC (samumed.com still redirects to biosplice.com). The company
  develops first-in-class small-molecule therapeutics that act on novel components of the Wnt
  signaling pathway and on the regulation of alternative pre-mRNA splicing. Its lead program is
  lorecivivint, an investigational intra-articular knee injection for osteoarthritis, positioned
  against a stated unmet need of "over 50 million US patients suffer from osteoarthritis, with no
  drugs available to arrest the disease"; the candidate has completed Phase 3 study and a New
  Drug Application has been submitted to the U.S. Food and Drug Administration. Programs outside
  lorecivivint — neurology, diabetes and oncology — are developed by the company's affiliate
  TenaRx, Inc. The company is led by Erich Horsley (Chief Executive Officer) with Osman Kibar as
  Founder and Executive Chairman, Yusuf Yazici as Chief Medical Officer, Phil Wilson as Chief
  Financial Officer and Scott W. Bulcao as Chief Legal Officer. Biosplice is a drug-discovery and
  clinical-development organization, not a software vendor: biosplice.com is a small ASP.NET
  corporate site covering mission, board, management, advisors, programs, publications, news and
  careers, and the company publishes no developer program of any kind — no API, no SDK, no
  developer portal, no GitHub organization and no machine-readable API contract.
